name: Excel diario Gurú vs Pinnacle

on:
  # Horario: lo dispara Supabase (pg_cron) cada mañana después de calificar al Gurú.
  workflow_dispatch:
    inputs:
      prueba:
        description: "Solo generar el archivo (no manda nada)"
        type: boolean
        default: true

env:
  BOT_URL: ${{ vars.BOT_URL }}   # la dirección de TU página en Vercel (variable del repositorio)

jobs:
  excel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Mandar Excel al dueño por Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python guru_excel.py ${{ inputs.prueba && '--prueba' || '' }}
