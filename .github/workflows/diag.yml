name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Probar estadios
        run: |
          cat > /tmp/t.mjs <<'JS'
          import { wikiEstadio } from "/home/runner/work/bot-apuestas/bot-apuestas/telegram/api/deportes.js";
          for (const n of ["Santiago Bernabéu", "Alfredo Harp Helú", "Estadio Benito Villamarín", "Giuseppe Meazza", "Diego Armando Maradona", "Ramón Sánchez-Pizjuán", "Nemesio Díez"]) {
            const r = await wikiEstadio(n); console.log(n.padEnd(30), "=>", r ? r.nombre : null);
            await new Promise(ok => setTimeout(ok, 1500));
          }
          JS
          node /tmp/t.mjs
