name: Diagnóstico (manual)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probar el token de Telegram (manda un mensaje al dueño)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -o /dev/null -w "getMe %{http_code}\n" "https://api.telegram.org/bot${TELEGRAM_TOKEN}/getMe"
          curl -s -o /dev/null -w "mensaje %{http_code}\n" -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" -d text="✅ Prueba: GitHub ya tiene el token nuevo. Las alertas de las 18:00 sí van a llegar."
          curl -s -o /dev/null -w "vercel %{http_code}\n" -H "x-bot-token: ${TELEGRAM_TOKEN}" "https://bot-apuestas-telegram.vercel.app/api/telegram?usuarios=1"
