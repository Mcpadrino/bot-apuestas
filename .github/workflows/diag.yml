name: diag
on: workflow_dispatch
permissions: { contents: write }
env:
  BOT_URL: ${{ vars.BOT_URL }}   # la dirección de TU página en Vercel (variable del repositorio)

jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar imágenes Progol a una rama temporal
        run: |
          mkdir out && cd out
          curl -s -L -A "Mozilla/5.0" "https://www.loterianacional.gob.mx/Documentos/juegos/Concursosysorteos/progol_quiniela/QuinielaProgol.jpg" -o quiniela.jpg
          curl -s -L -A "Mozilla/5.0" "https://www.loterianacional.gob.mx/Documentos/juegos/Concursosysorteos/progol_momios/porce.jpg" -o porce.jpg
          git init -q && git checkout -q -b diag-img && git add . && git -c user.name=diag -c user.email=diag@x commit -qm img
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag-img
