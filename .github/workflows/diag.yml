name: diag
on: workflow_dispatch
env:
  BOT_URL: ${{ vars.BOT_URL }}   # la dirección de TU página en Vercel (variable del repositorio)

jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar imágenes Progol
        run: |
          mkdir -p out
          curl -s -L -A "Mozilla/5.0" "https://www.loterianacional.gob.mx/Documentos/juegos/Concursosysorteos/progol_quiniela/QuinielaProgol.jpg" -o out/quiniela.jpg
          curl -s -L -A "Mozilla/5.0" "https://www.loterianacional.gob.mx/Documentos/juegos/Concursosysorteos/progol_momios/porce.jpg" -o out/porce.jpg
          ls -la out; file out/*
      - uses: actions/upload-artifact@v4
        with: { name: progol, path: out }
