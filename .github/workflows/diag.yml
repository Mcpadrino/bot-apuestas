name: diag
on: workflow_dispatch
env:
  BOT_URL: ${{ vars.BOT_URL }}   # la dirección de TU página en Vercel (variable del repositorio)

jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: Enlaces de históricos
        run: |
          for u in "https://www.loterianacional.gob.mx/Home/Historicos" "https://www.loterianacional.gob.mx/MelateRetro/Historicos" "https://www.loterianacional.gob.mx/Melate/Historicos" "https://www.loterianacional.gob.mx/MelateRetro/Resultados"; do
            echo "== $u"; curl -s -L -A "Mozilla/5.0" "$u" | grep -oiE '[^"]*ARHP=[^"]*|[^"]*[Hh]istoric[^"]*\.(csv|xls)[^"]*' | sort -u | head -20
          done
