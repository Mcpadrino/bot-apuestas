name: Diagnóstico (manual)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probar el token de Telegram (manda un mensaje al dueño)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os, urllib.request, json
          t = "".join(os.environ["TELEGRAM_TOKEN"].split())
          print("largo", len(t), "tiene 40lJ9", "40lJ9" in t)
          try:
              print("getMe", urllib.request.urlopen(f"https://api.telegram.org/bot{t}/getMe", timeout=15).status)
              d = json.dumps({"chat_id": os.environ["TELEGRAM_CHAT_ID"].strip(), "text": "✅ Prueba: GitHub ya tiene el token nuevo. Las alertas de las 18:00 sí van a llegar."}).encode()
              r = urllib.request.Request(f"https://api.telegram.org/bot{t}/sendMessage", data=d, headers={"content-type": "application/json"})
              print("mensaje", urllib.request.urlopen(r, timeout=15).status)
              r = urllib.request.Request("https://bot-apuestas-telegram.vercel.app/api/telegram?usuarios=1", headers={"x-bot-token": t})
              print("vercel", urllib.request.urlopen(r, timeout=15).status)
          except Exception as e:
              print("error", e)
          PY
