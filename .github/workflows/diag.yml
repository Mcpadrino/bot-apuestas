name: diag
on: workflow_dispatch
env:
  BOT_URL: ${{ vars.BOT_URL }}   # la dirección de TU página en Vercel (variable del repositorio)

jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: Progol
        run: |
          for u in "https://www.loterianacional.gob.mx/Progol/Quiniela" "https://www.loterianacional.gob.mx/Progol/Resultados" "https://www.loterianacional.gob.mx/Progol" "https://www.loterianacional.gob.mx/ProgolMedioSemana/Quiniela" "https://www.loterianacional.gob.mx/Progol/Historicos"; do
            echo "== $u"; curl -s -L -A "Mozilla/5.0" "$u" -o /tmp/p.html -w "%{http_code} %{size_download}\n"
            grep -oiE 'ARHP=[^"&]*|/[A-Za-z]+/[A-Za-z]*[Qq]uiniela[^"]*|api/[^"]*|\.json[^"]*' /tmp/p.html | sort -u | head -15
            python3 - <<'P'
          import re,html
          t=open('/tmp/p.html',encoding='utf-8',errors='replace').read()
          t=re.sub(r'<script.*?</script>|<style.*?</style>','',t,flags=re.S)
          t=html.unescape(re.sub(r'<[^>]+>',' | ',t)); t=re.sub(r'(\s*\|\s*)+',' | ',t)
          i=t.lower().find('local'); print(t[max(0,i-300):i+1500])
          P
          done
