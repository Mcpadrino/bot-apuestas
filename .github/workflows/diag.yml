name: diag
on: workflow_dispatch
env:
  BOT_URL: ${{ vars.BOT_URL }}   # la dirección de TU página en Vercel (variable del repositorio)

jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: Elo selecciones y J1
        run: |
          curl -s -A "Mozilla/5.0" https://www.eloratings.net/World.tsv | head -5
          curl -s -A "Mozilla/5.0" https://www.eloratings.net/en.teams.tsv | head -5
          for d in 20261113 20261114 20261115 20261116; do curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/jpn.1/scoreboard?dates=$d" | python3 -c "import sys,json; d=json.load(sys.stdin); print('$d', [e['name'] for e in d.get('events',[])])"; done
          for d in 20261114 20261115 20261116; do curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.friendly/scoreboard?dates=$d" | python3 -c "import sys,json; d=json.load(sys.stdin); print('$d', [(e['name'], e['competitions'][0].get('neutralSite')) for e in d.get('events',[])][:12])"; done
