name: diag
on: workflow_dispatch
env:
  BOT_URL: ${{ vars.BOT_URL }}   # la dirección de TU página en Vercel (variable del repositorio)

jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: Progol quiniela
        run: |
          curl -s -L -A "Mozilla/5.0" "https://www.loterianacional.gob.mx/Progol/Quiniela" -o /tmp/p.html
          python3 - <<'P'
          import re,html
          t=open('/tmp/p.html',encoding='utf-8',errors='replace').read()
          i=t.find('Instrumentos de Control y Consulta Archiv'); body=t[i:]
          print("SCRIPTS:", re.findall(r'<script[^>]*src="([^"]+)"', t)[-12:])
          print("AJAX:", sorted(set(re.findall(r'["\'](/[A-Za-z]+/[A-Za-z]+(?:\?[^"\']*)?)["\']', t)))[:80])
          b=re.sub(r'<style.*?</style>','',body,flags=re.S)
          print(re.sub(r'\s+',' ',b)[:6000])
          P
          echo; echo "== CSV Progol"; curl -s -L -A "Mozilla/5.0" "https://www.loterianacional.gob.mx/Home/Historicos?ARHP=UAByAG8AZwBvAGwA" | head -5
