name: diag
on: workflow_dispatch
env:
  BOT_URL: ${{ vars.BOT_URL }}   # la dirección de TU página en Vercel (variable del repositorio)

jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests -q
      - name: Explorar Polymarket 2
        run: |
          python3 - <<'P'
          import requests, json
          G="https://gamma-api.polymarket.com"
          for serie in ("10345","12185","10290","10188","10193","13"):
              r=requests.get(G+"/events",params={"series_id":serie,"closed":"false","limit":500},timeout=30).json()
              print("SERIE",serie,len(r))
              n=0
              for e in sorted(r,key=lambda e:e.get("startDate") or ""):
                  ms=[m for m in e.get("markets",[]) if m.get("sportsMarketType")=="moneyline"]
                  if not ms: continue
                  n+=1
                  if n>3: continue
                  print(" EV",e.get("slug"),"|",e.get("title"),"|start",e.get("startDate"),"|end",e.get("endDate"),"| keys",[k for k in e.keys()][:60])
                  for m in ms[:4]:
                      print("   M",json.dumps({k:m.get(k) for k in ("question","groupItemTitle","outcomes","outcomePrices","gameStartTime","bestBid","bestAsk","volume","closed","active")}))
              print(" moneyline events",n)
          P
