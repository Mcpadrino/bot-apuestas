name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: Probar LoL
        run: |
          for i in 1 2 3; do curl -s -m 60 -o /tmp/l.json -w "HTTP %{http_code} %{time_total}s\n" https://bot-apuestas-telegram.vercel.app/api/lol; python3 -c "import json;d=json.load(open('/tmp/l.json'));print(len(d.get('eventos',[])),'eventos',d.get('series_elo'),'elo',d.get('error'),d.get('viejo'))"; sleep 5; done
