name: diag
on: workflow_dispatch
env:
  BOT_URL: ${{ vars.BOT_URL }}   # la dirección de TU página en Vercel (variable del repositorio)

jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: Probar /api/melate en producción
        run: |
          U="${BOT_URL:-https://bot-apuestas-telegram.vercel.app}"
          for j in melate revancha revanchita retro; do curl -s "$U/api/melate?juego=$j" | python3 -c "import sys,json; d=json.load(sys.stdin); print('$j', d.get('nombre'), d.get('n'), d.get('desde'), len(d.get('sorteos',[])), d.get('sorteos',[[]])[-1], d.get('error'))"; done
