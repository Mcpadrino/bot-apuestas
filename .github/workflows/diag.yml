name: diag
on: workflow_dispatch
env:
  BOT_URL: ${{ vars.BOT_URL }}   # la dirección de TU página en Vercel (variable del repositorio)

jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: Estadio Morelos en Wikipedia
        run: |
          for lang in en es; do curl -s "https://$lang.wikipedia.org/w/api.php?action=query&prop=pageimages&piprop=thumbnail&pithumbsize=1600&redirects=1&format=json&titles=Estadio%20Morelos" -H "user-agent: bitacora-diag" ; echo; done
