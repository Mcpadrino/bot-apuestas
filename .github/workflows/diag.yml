name: Diagnóstico (manual)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: LoL Esports API
        run: |
          K="0TvQnueqKa5mxJntVWt0w4LpLfEkrV1Ta8rQBb9Z"
          curl -s -H "x-api-key: $K" "https://esports-api.lolesports.com/persisted/gw/getLeagues?hl=es-MX" | head -c 1500; echo
          curl -s -H "x-api-key: $K" "https://esports-api.lolesports.com/persisted/gw/getSchedule?hl=es-MX&leagueId=98767975604431411" | head -c 2500; echo
          curl -s -H "x-api-key: $K" "https://esports-api.lolesports.com/persisted/gw/getLive?hl=es-MX" | head -c 2500; echo
