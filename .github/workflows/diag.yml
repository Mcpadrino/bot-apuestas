name: Diagnóstico (manual)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Estadios (ESPN + Wikipedia)
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          def g(u, h=None):
              r = urllib.request.Request(u, headers={"user-agent": "bitacora-apuestas/1.0 (contacto: github Mcpadrino)", **(h or {})})
              return json.load(urllib.request.urlopen(r, timeout=20))
          for ruta, eid in [("soccer/mex.1", "227"), ("soccer/eng.1", "359"), ("football/nfl", "12"), ("basketball/nba", "13")]:
              try:
                  t = g(f"https://site.api.espn.com/apis/site/v2/sports/{ruta}/teams/{eid}")["team"]
                  v = t.get("venue") or (t.get("franchise") or {}).get("venue") or {}
                  print(ruta, t.get("displayName"), "| venue:", v.get("fullName"), v.get("address"), "imgs:", [i.get("href") for i in v.get("images", [])][:2])
                  nombre = v.get("fullName")
                  if nombre:
                      w = g("https://en.wikipedia.org/w/api.php?" + urllib.parse.urlencode({"action": "query", "prop": "pageimages", "titles": nombre,
                            "pithumbsize": 1200, "redirects": 1, "format": "json", "piprop": "thumbnail|name"}))
                      print("   wiki:", [(p.get("title"), (p.get("thumbnail") or {}).get("source")) for p in w["query"]["pages"].values()])
              except Exception as e:
                  print(ruta, "error", e)
          PY
