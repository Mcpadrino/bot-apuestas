name: diag
on: workflow_dispatch
env:
  BOT_URL: ${{ vars.BOT_URL }}   # la dirección de TU página en Vercel (variable del repositorio)

jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: Progol momios
        run: |
          for u in "https://www.loterianacional.gob.mx/Progol/Momios" "https://www.loterianacional.gob.mx/Progol/Progol"; do
          curl -s -L -A "Mozilla/5.0" "$u" -o /tmp/p.html
          python3 - <<'P'
          import re
          t=open('/tmp/p.html',encoding='utf-8',errors='replace').read()
          i=t.find('<main'); j=t.find('</main>')
          m=t[i:j]
          m=re.sub(r'<svg.*?</svg>','',m,flags=re.S)
          print("IMGS/DOCS:", re.findall(r'(?:src|href|data)="([^"]*(?:Documentos|\.jpg|\.png|\.pdf)[^"]*)"', m)[:20])
          print(re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' | ',m))[:4000])
          P
          done
