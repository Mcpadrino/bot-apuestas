name: diag
on: workflow_dispatch
env:
  BOT_URL: ${{ vars.BOT_URL }}   # la dirección de TU página en Vercel (variable del repositorio)

jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: Ligas ESPN
        run: |
          for l in ned.1 por.1 bel.1 sco.1 tur.1 aut.1 gre.1 sui.1 den.1 cze.1 cro.1 pol.1 nor.1 swe.1 cyp.1 svn.1 srb.1 uefa.europa.conf uefa.europa; do
            n=$(curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/$l/scoreboard?dates=20261105" | python3 -c "import json,sys;d=json.load(sys.stdin);print(len(d.get('events',[])), d.get('leagues',[{}])[0].get('name','?'))" 2>/dev/null)
            m=$(curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/$l/scoreboard?dates=20261101" | python3 -c "import json,sys;d=json.load(sys.stdin);print(len(d.get('events',[])))" 2>/dev/null)
            echo "$l | 5nov: $n | 1nov: $m"
          done
