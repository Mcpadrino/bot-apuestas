name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Probar estadios
        run: |
          cd telegram
          cat > /tmp/t.mjs <<'JS'
          import { wikiEstadio } from "/home/runner/work/bot-apuestas/bot-apuestas/telegram/api/deportes.js";
          for (const n of ["Santiago Bernabéu", "Estadio Santiago Bernabéu", "Estadio Alfredo Harp Helú", "Alfredo Harp Helú", "Estadio Akron", "Estadio Ciudad de los Deportes", "Estadio Olímpico Universitario", "Estadio Nemesio Díez", "Hard Rock Stadium", "Estadio Hidalgo", "Estadio Jalisco", "Estadio Victoria", "Estadio Cuauhtémoc", "Estadio Banorte", "Spotify Camp Nou", "Riyadh Air Metropolitano", "Estadio Benito Villamarín", "Estadio Ramón Sánchez-Pizjuán", "Estadio Mestalla", "Stade Vélodrome", "Giuseppe Meazza", "Diego Armando Maradona", "Stadio Olimpico"]) {
            const r = await wikiEstadio(n); console.log(n.padEnd(36), "=>", r ? r.nombre : null);
          }
          JS
          node /tmp/t.mjs
          curl -s -A "bitacora-apuestas/1.0 (github.com/Mcpadrino/bot-apuestas)" -o /dev/null -w "%{http_code}\n" "https://en.wikipedia.org/w/api.php?action=query&prop=pageimages|description|categories&piprop=thumbnail&pithumbsize=1600&cllimit=30&redirects=1&format=json&origin=*&titles=Estadio%20Jalisco"
          curl -s -A "bitacora-apuestas/1.0 (github.com/Mcpadrino/bot-apuestas)" "https://en.wikipedia.org/w/api.php?action=query&prop=pageimages|description|categories&piprop=thumbnail&pithumbsize=1600&cllimit=30&redirects=1&format=json&origin=*&titles=Estadio%20Jalisco" | head -c 700; echo
          curl -s -A "bitacora-apuestas/1.0 (github.com/Mcpadrino/bot-apuestas)" "https://en.wikipedia.org/w/api.php?action=query&prop=pageimages|description&piprop=thumbnail&redirects=1&format=json&titles=Santiago%20Bernab%C3%A9u%20Stadium|Santiago%20Bernab%C3%A9u" | head -c 900; echo
