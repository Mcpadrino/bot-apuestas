name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: Probar
        env:
          T: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          U=https://bot-apuestas-telegram.vercel.app
          echo "--- premiar"; curl -s -X POST "$U/api/telegram?mas=1" -H "x-bot-token: $T" -H 'content-type: application/json' -d '{"accion":"torneo_premiar","datos":{}}'; echo
          echo "--- pagina"; curl -s $U/ | grep -c "Tour de la app\|pr-modo\|TOUR = "
