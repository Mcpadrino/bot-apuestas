name: Diagnóstico (manual)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probar api/lol.js
        working-directory: telegram
        run: |
          node --input-type=module -e '
          import h from "./api/lol.js";
          const res = { setHeader() {}, status(c) { this.c = c; return this; }, json(d) {
            console.log("status", this.c, "series para Elo:", d.series_elo, "eventos:", d.eventos?.length, "en vivo:", JSON.stringify(d.enVivo).slice(0, 600));
            const p = (d.eventos || []).filter(e => e.estado !== "completed").slice(0, 4);
            console.log(JSON.stringify(p, null, 1).slice(0, 2500));
            console.log("resultados:", (d.eventos || []).filter(e => e.estado === "completed").slice(-3).map(e => [e.a?.code, e.a?.juegos, e.b?.code, e.b?.juegos, e.prob_a]));
          } };
          await h({ query: {} }, res);'
