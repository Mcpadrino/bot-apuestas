name: diag
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: Páginas oficiales
        run: |
          mkdir -p o && cd o
          B=https://www.loterianacional.gob.mx
          for p in Progol/Coperacha ProgolMediaSemana/Coperacha ProgolMediaSemana/ComoJugar ProgolMediaSemana/Resultados ProgolMediaSemana/Quiniela Protouch/Coperacha Protouch/ComoJugar Protouch/Quiniela Protouch/Resultados Progol/Quiniela Progol/Resultados Home/Historicos MediaSemana/Coperacha; do
            f=$(echo $p | tr / _); curl -s -L -A "Mozilla/5.0" "$B/$p" -o "$f.html"; echo "$p $(wc -c < $f.html)"; done
          python3 - <<'PY'
          import re,glob,html
          for f in glob.glob('*.html'):
              s=open(f,errors='ignore').read()
              t=re.sub(r'<script.*?</script>|<style.*?</style>','',s,flags=re.S)
              t=html.unescape(re.sub(r'<[^>]+>',' ',t)); t=re.sub(r'\s+',' ',t)
              open(f[:-5]+'.txt','w').write(t)
              links=sorted(set(re.findall(r'(?:href|src)="([^"]+)"',s)))
              open(f[:-5]+'.links','w').write('\n'.join(links))
          PY
          ls -la
      - name: Subir
        run: |
          cd o && git init -q && git checkout -q -b diag-img && git add -A && git -c user.name=d -c user.email=d@d commit -qm d
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-img
