name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: Probar
        run: |
          U=https://bot-apuestas-telegram.vercel.app/api/deportes
          curl -s "$U?op=estadios&ruta=soccer/esp.1&id=86" | python3 -c "import json,sys;d=json.load(sys.stdin);print('CLUB',d.get('club'));[print('G',g['nombre'],g.get('pedido'),g['foto'][:90]) for g in d.get('galeria',[])]"
