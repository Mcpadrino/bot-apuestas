name: diag
on: workflow_dispatch
env:
  BOT_URL: ${{ vars.BOT_URL }}   # la dirección de TU página en Vercel (variable del repositorio)

jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: ESPN fechas
        run: |
          for l in fifa.friendly fifa.worldq.uefa bra.1 bra.2 jpn.1 mex.1 usa.1 fifa.worldq.concacaf; do
            for q in "dates=20261113-20261117" "dates=20261114" "dates=20261114&limit=300"; do
              curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/$l/scoreboard?$q" | python3 -c "import sys,json
          try:
            d=json.load(sys.stdin); ev=d.get('events',[]); print('$l','$q',len(ev),[e['name'] for e in ev[:4]], [list((e['competitions'][0].get('odds') or [{}])[0].keys())[:8] for e in ev[:1]])
          except Exception as e: print('$l','$q','ERR',e)"
            done
          done
