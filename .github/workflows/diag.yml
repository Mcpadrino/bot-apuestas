name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: Mandar folleto, guía y manual al dueño
        env:
          T: ${{ secrets.TELEGRAM_TOKEN }}
          C: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          B=https://bot-apuestas-telegram.vercel.app/docs
          curl -s -o /dev/null -w "%{http_code} folleto-url\n" $B/folleto.pdf
          for f in "folleto.pdf|📄 Folleto: qué es el bot y todo lo que incluye." "guia-usuario.pdf|📘 Guía del usuario (explicada desde cero)." "manual-completo.pdf|🛠 Manual completo con la parte de administrador. Tip: escribe guía al bot cuando quieras volver a recibirlos."; do
            curl -s -X POST "https://api.telegram.org/bot$T/sendDocument" -d chat_id="$C" --data-urlencode document="$B/${f%%|*}?v=3" --data-urlencode caption="${f#*|}" | head -c 80; echo
          done
