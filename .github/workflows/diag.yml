name: Diagnóstico (manual)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Buscar el id del canal de YouTube
        run: |
          for h in IbaiExtra ibaiextra Ibai_Extra; do
            echo "== $h"
            curl -sL -A "Mozilla/5.0" -H "Accept-Language: es" "https://www.youtube.com/@$h" | grep -oE '"(channelId|externalId)":"UC[A-Za-z0-9_-]{22}"|<title>[^<]*' | sort | uniq -c | head -5
          done
