name: Resumen semanal

on:
  # Horario: lo dispara Supabase (pg_cron) a la hora exacta; GitHub no estaba corriendo los cron.
  workflow_dispatch:
    inputs:
      prueba:
        description: "Solo mostrar el mensaje (no enviar)"
        type: boolean
        default: true

env:
  BOT_URL: ${{ vars.BOT_URL }}   # la dirección de TU página en Vercel (variable del repositorio)

jobs:
  resumen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Enviar resumen
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python resumen_semanal.py ${{ inputs.prueba && '--prueba' || '' }}
