name: Gurú (pronósticos)

on:
  # Horario: lo dispara Supabase (pg_cron) a la hora exacta; GitHub no estaba corriendo los cron.
  workflow_dispatch:
    inputs:
      prueba:
        description: "Solo mostrar (no guarda nada)"
        type: boolean
        default: false

env:
  BOT_URL: ${{ vars.BOT_URL }}   # la dirección de TU página en Vercel (variable del repositorio)

jobs:
  guru:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt penaltyblog pandas
      - uses: actions/cache@v4             # tiros de partidos ya consultados (para no pedirlos otra vez a ESPN)
        with:
          path: cache_tiros.json
          key: tiros-${{ github.run_id }}
          restore-keys: tiros-
      - uses: actions/cache@v4             # días de ESPN ya consultados (los partidos viejos no cambian)
        with:
          path: cache_dias.json
          key: dias-${{ github.run_id }}
          restore-keys: dias-
      - name: Calcular pronósticos y calificar los terminados
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pronosticos.py ${{ inputs.prueba && '--prueba' || '' }}
